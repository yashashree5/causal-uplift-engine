<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1500" height="1020" fill="#ffffff"/>

  <text x="750" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Causal Uplift Engine: System Architecture</text>
  <text x="750" y="68" text-anchor="middle" font-size="15" fill="#475569">Who should get which email, under a budget, with effects shown to be correct (Hillstrom)</text>

  <!-- ============ Column 1: Data sources ============ -->
  <rect x="30" y="90" width="260" height="44" rx="8" fill="#0f766e"/>
  <text x="160" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1. Data sources</text>
  <rect x="30" y="140" width="260" height="400" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <rect x="45" y="160" width="230" height="110" rx="6" fill="#fff" stroke="#99f6e4"/>
  <text x="160" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Hillstrom experiment</text>
  <text x="160" y="214" text-anchor="middle" font-size="13" fill="#334155">64,000 customers</text>
  <text x="160" y="234" text-anchor="middle" font-size="13" fill="#334155">men's email · women's email</text>
  <text x="160" y="252" text-anchor="middle" font-size="13" fill="#334155">· no email (random)</text>
  <rect x="45" y="290" width="230" height="120" rx="6" fill="#fff" stroke="#99f6e4"/>
  <text x="160" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Semi-synthetic Hillstrom</text>
  <text x="160" y="344" text-anchor="middle" font-size="13" fill="#334155">real customer features</text>
  <text x="160" y="364" text-anchor="middle" font-size="13" fill="#334155">+ simulated outcomes with</text>
  <text x="160" y="384" text-anchor="middle" font-size="13" fill="#334155">known true effects (for PEHE)</text>
  <text x="160" y="470" text-anchor="middle" font-size="13" fill="#0f766e" font-style="italic">Same dataset, two uses:</text>
  <text x="160" y="490" text-anchor="middle" font-size="13" fill="#0f766e" font-style="italic">real for business value,</text>
  <text x="160" y="510" text-anchor="middle" font-size="13" fill="#0f766e" font-style="italic">semi-synthetic for accuracy</text>

  <!-- ============ Column 2: Data pipeline ============ -->
  <rect x="320" y="90" width="260" height="44" rx="8" fill="#1d4ed8"/>
  <text x="450" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2. Data pipeline</text>
  <rect x="320" y="140" width="260" height="400" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="450" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Automated by GitHub Actions</text>
  <rect x="335" y="180" width="230" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="450" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Extract</text>
  <text x="450" y="228" text-anchor="middle" font-size="12.5" fill="#334155">download → Parquet + checksum</text>
  <rect x="335" y="262" width="230" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="450" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Load → Snowflake RAW</text>
  <text x="450" y="310" text-anchor="middle" font-size="12.5" fill="#334155">cloud data warehouse</text>
  <rect x="335" y="344" width="230" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="450" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">dbt: STAGING → VALIDATED</text>
  <text x="450" y="392" text-anchor="middle" font-size="12.5" fill="#334155">data tests, randomization check</text>
  <rect x="335" y="426" width="230" height="64" rx="6" fill="#fff" stroke="#bfdbfe"/>
  <text x="450" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Export splits</text>
  <text x="450" y="474" text-anchor="middle" font-size="12.5" fill="#334155">train · validate · untouched test</text>
  <line x1="450" y1="244" x2="450" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="450" y1="326" x2="450" y2="342" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="450" y1="408" x2="450" y2="424" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ============ Column 3: Experimentation engine ============ -->
  <rect x="610" y="90" width="260" height="44" rx="8" fill="#7c3aed"/>
  <text x="740" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3. Experimentation engine</text>
  <rect x="610" y="140" width="260" height="400" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <g font-size="14" fill="#0f172a">
    <rect x="625" y="158" width="230" height="58" rx="6" fill="#fff" stroke="#ddd6fe"/>
    <text x="740" y="182" text-anchor="middle" font-weight="700">Assignment</text>
    <text x="740" y="202" text-anchor="middle" font-size="12.5" fill="#334155">randomize customers to arms</text>
    <rect x="625" y="232" width="230" height="58" rx="6" fill="#fff" stroke="#ddd6fe"/>
    <text x="740" y="256" text-anchor="middle" font-weight="700">Event logging</text>
    <text x="740" y="276" text-anchor="middle" font-size="12.5" fill="#334155">every send and visit → Snowflake</text>
    <rect x="625" y="306" width="230" height="58" rx="6" fill="#fff" stroke="#ddd6fe"/>
    <text x="740" y="330" text-anchor="middle" font-weight="700">Guardrail metrics</text>
    <text x="740" y="350" text-anchor="middle" font-size="12.5" fill="#334155">spend, visit drop-off</text>
    <rect x="625" y="380" width="230" height="58" rx="6" fill="#fff" stroke="#ddd6fe"/>
    <text x="740" y="404" text-anchor="middle" font-weight="700">CUPED</text>
    <text x="740" y="424" text-anchor="middle" font-size="12.5" fill="#334155">variance reduction</text>
    <rect x="625" y="454" width="230" height="64" rx="6" fill="#fff" stroke="#ddd6fe"/>
    <text x="740" y="478" text-anchor="middle" font-weight="700">Sequential testing</text>
    <text x="740" y="498" text-anchor="middle" font-size="12.5" fill="#334155">valid error control (A/A checks)</text>
  </g>

  <!-- ============ Column 4: Models ============ -->
  <rect x="900" y="90" width="270" height="44" rx="8" fill="#c2410c"/>
  <text x="1035" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4. Uplift models</text>
  <rect x="900" y="140" width="270" height="400" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="1035" y="164" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">Each solves the full problem:</text>
  <text x="1035" y="182" text-anchor="middle" font-size="12.5" fill="#c2410c">data + budget → effects + email plan</text>
  <rect x="915" y="196" width="240" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1035" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Baseline: CausalPFN</text>
  <text x="1035" y="236" text-anchor="middle" font-size="12" fill="#334155">NeurIPS 2025, reproduced</text>
  <g font-size="13.5" fill="#0f172a">
    <rect x="915" y="258" width="240" height="60" rx="6" fill="#fff" stroke="#fdba74"/>
    <text x="1035" y="281" text-anchor="middle" font-weight="700">M1 Retrieval uplift transformer</text>
    <text x="1035" y="301" text-anchor="middle" font-size="12" fill="#334155">learns from similar customers</text>
    <rect x="915" y="326" width="240" height="60" rx="6" fill="#fff" stroke="#fdba74"/>
    <text x="1035" y="349" text-anchor="middle" font-weight="700">M2 Real-data CausalPFN</text>
    <text x="1035" y="369" text-anchor="middle" font-size="12" fill="#334155">fine-tuned on real experiment</text>
    <rect x="915" y="394" width="240" height="60" rx="6" fill="#fff" stroke="#fdba74"/>
    <text x="1035" y="417" text-anchor="middle" font-weight="700">M3 Fine-tuned LLM estimator</text>
    <text x="1035" y="437" text-anchor="middle" font-size="12" fill="#334155">Qwen3 8B + LoRA</text>
    <rect x="915" y="462" width="240" height="60" rx="6" fill="#fff" stroke="#fdba74"/>
    <text x="1035" y="485" text-anchor="middle" font-weight="700">M4 LLM agent planner</text>
    <text x="1035" y="505" text-anchor="middle" font-size="12" fill="#334155">readable, tested segments</text>
  </g>

  <!-- ============ Column 5: Evaluation ============ -->
  <rect x="1200" y="90" width="270" height="44" rx="8" fill="#be123c"/>
  <text x="1335" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5. Evaluation</text>
  <rect x="1200" y="140" width="270" height="400" rx="8" fill="#fff1f2" stroke="#be123c"/>
  <g font-size="14" fill="#0f172a">
    <rect x="1215" y="158" width="240" height="58" rx="6" fill="#fff" stroke="#fecdd3"/>
    <text x="1335" y="182" text-anchor="middle" font-weight="700">PEHE · policy risk</text>
    <text x="1335" y="202" text-anchor="middle" font-size="12.5" fill="#334155">semi-synthetic, true effects known</text>
    <rect x="1215" y="230" width="240" height="58" rx="6" fill="#fff" stroke="#fecdd3"/>
    <text x="1335" y="254" text-anchor="middle" font-weight="700">Qini · uplift curves</text>
    <text x="1335" y="274" text-anchor="middle" font-size="12.5" fill="#334155">real Hillstrom</text>
    <rect x="1215" y="302" width="240" height="58" rx="6" fill="#fff" stroke="#fecdd3"/>
    <text x="1335" y="326" text-anchor="middle" font-weight="700">Incremental lift</text>
    <text x="1335" y="346" text-anchor="middle" font-size="12.5" fill="#334155">vs. email-all, random, CausalPFN</text>
    <rect x="1215" y="374" width="240" height="58" rx="6" fill="#fff" stroke="#fecdd3"/>
    <text x="1335" y="398" text-anchor="middle" font-weight="700">False-positive rate</text>
    <text x="1335" y="418" text-anchor="middle" font-size="12.5" fill="#334155">sequential tests on A/A data</text>
    <rect x="1215" y="446" width="240" height="72" rx="6" fill="#fde68a" stroke="#d97706"/>
    <text x="1335" y="472" text-anchor="middle" font-weight="700">Results → Snowflake</text>
    <text x="1335" y="492" text-anchor="middle" font-size="12.5" fill="#334155">ANALYTICS schema</text>
    <text x="1335" y="509" text-anchor="middle" font-size="12" fill="#334155">effects, plans, metrics</text>
  </g>

  <!-- main flow arrows -->
  <line x1="290" y1="340" x2="318" y2="340" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="580" y1="340" x2="608" y2="340" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="870" y1="340" x2="898" y2="340" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="1170" y1="340" x2="1198" y2="340" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>

  <g transform="translate(0,28)">
<!-- ============ Bottom band: decision assistant ============ -->
  <rect x="30" y="612" width="1440" height="44" rx="8" fill="#0f172a"/>
  <text x="750" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6. Decision assistant: RAG + LLM agent + chatbot</text>

  <!-- RAG -->
  <rect x="30" y="670" width="430" height="230" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="245" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#0e7490">RAG knowledge base</text>
  <text x="245" y="722" text-anchor="middle" font-size="12.5" fill="#334155">vector index (retrieved as context)</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="60" y="756">• Results and effect tables (ANALYTICS)</text>
    <text x="60" y="782">• Feature dictionary and data definitions</text>
    <text x="60" y="808">• Experiment logs and guardrail history</text>
    <text x="60" y="834">• Method notes (CUPED, sequential tests)</text>
  </g>
  <text x="245" y="874" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="700">Never stores untouched-test outcomes</text>

  <!-- Agent -->
  <rect x="535" y="670" width="430" height="230" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="750" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#a16207">LLM agent (Qwen3 8B)</text>
  <text x="750" y="722" text-anchor="middle" font-size="12.5" fill="#334155">plans steps and calls tools</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="565" y="756">Tools:</text>
    <text x="565" y="780">• query results in Snowflake</text>
    <text x="565" y="804">• run a model (baseline, M1–M4)</text>
    <text x="565" y="828">• run CUPED / sequential test</text>
    <text x="565" y="852">• budget planner (who gets which email)</text>
  </g>
  <text x="750" y="884" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="700">Every number shown comes from a tool</text>

  <!-- Chatbot -->
  <rect x="1040" y="670" width="430" height="230" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1255" y="700" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Chatbot (Streamlit)</text>
  <text x="1255" y="722" text-anchor="middle" font-size="12.5" fill="#334155">used by the marketing team</text>
  <rect x="1060" y="740" width="390" height="50" rx="10" fill="#dcfce7"/>
  <text x="1075" y="762" font-size="13" fill="#0f172a">Marketer: "Who should get the women's</text>
  <text x="1075" y="780" font-size="13" fill="#0f172a">email with a 20% budget?"</text>
  <rect x="1060" y="802" width="390" height="80" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="1075" y="824" font-size="13" fill="#0f172a">Assistant: email plan + who gets what,</text>
  <text x="1075" y="844" font-size="13" fill="#0f172a">expected extra visits, confidence</text>
  <text x="1075" y="864" font-size="13" fill="#0f172a">intervals, and why each rule was chosen</text>

  </g>
<!-- assistant arrows -->
  <path d="M1335,540 L1335,590 L245,590 L245,638" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="582" text-anchor="middle" font-size="12.5" fill="#475569">results indexed for retrieval</text>
  <path d="M1035,540 L1035,620 L860,620 L860,638" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="1110" y="614" text-anchor="middle" font-size="12" fill="#475569">models as tools</text>
  <g transform="translate(0,28)">
  <line x1="460" y1="785" x2="533" y2="785" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="497" y="775" text-anchor="middle" font-size="12" fill="#475569">context</text>
  <line x1="967" y1="770" x2="1038" y2="770" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <line x1="1038" y1="805" x2="967" y2="805" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="1002" y="762" text-anchor="middle" font-size="12" fill="#475569">answer</text>
  <text x="1002" y="822" text-anchor="middle" font-size="12" fill="#475569">question</text>

  </g>
  <text x="750" y="990" text-anchor="middle" font-size="13" fill="#64748b">Stack: GitHub Actions · Snowflake · dbt · PyTorch (college / Kaggle GPU) · Qwen3 8B · vector store · Streamlit · Linear + GitHub</text>
</svg>
