name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" -r eda/requirements.txt -r ingestion/requirements-gcs.txt -r streaming/producer/requirements.txt
      - run: ruff check .
      - run: pytest -q
