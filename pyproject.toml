[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift-engine"
version = "0.1.0"
description = "CausalPFN reproduction and retrieval uplift transformer on Hillstrom and Criteo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
pipeline = [
    "scikit-uplift>=0.5.1",
    "snowflake-connector-python>=3.10",
    "cryptography>=42",
    "dbt-core>=1.8,<2",
    "dbt-snowflake>=1.8,<2",
    "dbt-duckdb>=1.8,<2",
    "python-dotenv>=1",
]
models = [
    "scikit-uplift>=0.5.1",
    "econml",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "wandb>=0.17",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "eval*", "models*", "baseline*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
